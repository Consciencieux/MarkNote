name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '22.23.4'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      artifact_name: ${{ steps.prepare.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Verify tag belongs to main
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo '::error::标签对应的提交不在 main 历史中'
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${GITHUB_REF}^{commit}")"

      - name: Install JSON5 parser
        run: |
          python3 -m venv "$RUNNER_TEMP/release-python"
          "$RUNNER_TEMP/release-python/bin/python" -m pip install 'json5==0.16.0'

      - name: Validate version and prepare release notes
        id: prepare
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          "$RUNNER_TEMP/release-python/bin/python" - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path
          import json5

          tag = os.environ['RELEASE_TAG']
          app = json5.loads(Path('AppScope/app.json5').read_text(encoding='utf-8'),
                            allow_duplicate_keys=False)['app']
          version = app['versionName']
          if not re.fullmatch(r'v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', tag) or tag != f'v{version}':
              raise SystemExit(f'标签 {tag} 与应用版本 {version} 不一致，或不是正式版本标签')

          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          match = re.search(r'^##[ \t]+' + re.escape(version) + r'[ \t]*\n(.*?)(?=^##[ \t]|\Z)',
                            changelog, re.MULTILINE | re.DOTALL)
          if not match or not match.group(1).strip():
              raise SystemExit(f'CHANGELOG.md 中缺少 {version} 的更新日志')
          notes = match.group(1).strip()
          if '本版本先提供源码，安装包将另行发布。' in notes:
              raise SystemExit('请先更新本版本日志：Release 将包含未签名 debug HAP')

          repo = os.environ['GITHUB_REPOSITORY']
          notes = notes.replace('](docs/FEATURES.md)',
                                f'](https://github.com/{repo}/blob/{sha}/docs/FEATURES.md)')
          notes += ('\n\n此 HAP 可在兼容的模拟器中验证；'
                    '真机安装需要自行配置调试签名。'
                    f'\n\n构建提交：`{sha}`'
                    f'\n\n<!-- marknote-release:{sha} -->\n')

          out = Path(os.environ['RUNNER_TEMP']) / 'release-inputs'
          out.mkdir(parents=True, exist_ok=True)
          (out / 'release-notes.md').write_text(notes, encoding='utf-8')
          name = f"release-inputs-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'source_sha={sha}\nartifact_name={name}\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: ${{ runner.temp }}/release-inputs/release-notes.md
          if-no-files-found: error
          retention-days: 7

  validate-renderer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: renderer/package-lock.json

      - name: Check, test and rebuild renderer
        working-directory: renderer
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - name: Require generated resources to match the tag
        run: |
          paths=(
            entry/src/main/resources/rawfile/preview/index.html
            entry/src/main/resources/rawfile/licenses
          )
          changes="$(git status --porcelain --untracked-files=all -- "${paths[@]}")"
          if [[ -n "$changes" ]]; then
            printf '%s\n' "$changes"
            echo '::error::预览或许可证生成文件与标签不一致，请重新生成并提交后发布新标签'
            exit 1
          fi

  create-draft:
    needs: [prepare, validate-renderer]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: release-inputs

      - name: Create or resume draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          verify_tag() {
            remote_sha="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')"
            if [[ "$remote_sha" != "$SOURCE_SHA" ]]; then
              echo '::error::远端标签已发生变化，拒绝创建 Release 草稿'
              exit 1
            fi
          }
          verify_tag

          gh api --paginate "repos/$GH_REPO/releases?per_page=100" |
            jq -s --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)]' \
              > "$RUNNER_TEMP/matching-releases.json"
          state="$RUNNER_TEMP/matching-releases.json"
          count="$(jq 'length' "$state")"
          marker="<!-- marknote-release:$SOURCE_SHA -->"

          case "$count" in
            0)
              gh release create "$RELEASE_TAG" --draft --verify-tag \
                --target "$SOURCE_SHA" --title "MarkNote $RELEASE_TAG" \
                --notes-file release-inputs/release-notes.md
              ;;
            1)
              if ! jq -e '.[0].draft == true' "$state" > /dev/null; then
                echo '::error::该版本已经正式发布，不自动覆盖；修改后请发布新版本'
                exit 1
              fi
              if ! jq -e --arg marker "$marker" \
                '(.[0].body // "") | contains($marker)' "$state" > /dev/null; then
                echo '::error::已有草稿不是本工作流为同一提交创建的，请先人工检查'
                exit 1
              fi
              gh release edit "$RELEASE_TAG" --draft --verify-tag \
                --title "MarkNote $RELEASE_TAG" \
                --notes-file release-inputs/release-notes.md
              ;;
            *) echo '::error::同一标签存在多个 Release，请人工检查'; exit 1 ;;
          esac

          verify_tag
          gh release view "$RELEASE_TAG" --json isDraft,url --jq '
            if .isDraft then .url else error("Release 不是草稿") end
          '
