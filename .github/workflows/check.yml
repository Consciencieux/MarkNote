name: Check
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  renderer-and-resources:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: |
            renderer/package-lock.json
            editor/package-lock.json
      - name: Check resource keys, placeholders and dependency metadata
        run: python3 tools/check_resources.py
      - name: Install editor dependencies
        working-directory: editor
        run: npm ci
      - name: Check, test and rebuild renderer
        working-directory: renderer
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Check, test and rebuild editor
        working-directory: editor
        run: |
          npm run check
          npm test
          npm run build
      - name: Require generated preview and licenses to match source
        run: |
          git diff --check
          changes="$(git status --porcelain --untracked-files=all -- entry/src/main/resources/rawfile)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            echo '::error::重新构建并提交预览、许可证生成文件后再合并'
            exit 1
          fi
